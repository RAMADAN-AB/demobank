spring.application.name=novaBank-backend

# Base de donnees PostgreSQL
# Les valeurs sensibles viennent de variables d'environnement (voir .env.example)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/novabank_db}
spring.datasource.username=${DB_USERNAME:novabank}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Securite JWT - AUCUNE valeur par defaut : l'application refuse de demarrer sans
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS : origines du front autorisees (separees par des virgules)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost}
