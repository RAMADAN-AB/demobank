# Configuration de test : base H2 en memoire, aucune dependance a PostgreSQL ni aux variables d'environnement
spring.datasource.url=jdbc:h2:mem:demobank;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Cle de test uniquement (256 bits encodes en Base64), sans valeur en dehors des tests
application.security.jwt.secret-key=dGVzdC1zZWNyZXQta2V5LWZvci1kZW1vYmFuay10ZXN0cy0yNTZiaXQ=
application.security.jwt.expiration=3600000

app.cors.allowed-origins=http://localhost:4200
