<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>{{ isLoginMode ? 'Connexion à NovaBank' : 'Créer un compte NovaBank' }}</h2>
      <p>{{ isLoginMode ? 'Accédez à votre espace bancaire sécurisé' : 'Rejoignez-nous en quelques secondes' }}</p>
    </div>

    <!-- Message d'erreur -->
    <div class="error-alert" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <!-- Formulaire de Connexion -->
    <form *ngIf="isLoginMode" [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <div class="form-group">
          <label for="login-email">Adresse Email</label>
          <input id="login-email" type="email" formControlName="email" placeholder="alex@novabank.com" />
        </div>

        <div class="form-group">
          <label for="login-password">Mot de passe</label>
          <input id="login-password" type="password" formControlName="password" placeholder="••••••••" />
        </div>

        <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn-primary">
          {{ isLoading ? 'Connexion en cours...' : 'Se connecter' }}
        </button>
      </form>

    <!-- Formulaire d'Inscription -->
    <form *ngIf="!isLoginMode" [formGroup]="registerForm" (ngSubmit)="onRegister()">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">Prénom</label>
            <input id="firstName" type="text" formControlName="firstName" placeholder="Alexandre" />
          </div>
          <div class="form-group">
            <label for="lastName">Nom</label>
            <input id="lastName" type="text" formControlName="lastName" placeholder="Dupont" />
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">Adresse Email</label>
          <input id="reg-email" type="email" formControlName="email" placeholder="alex@novabank.com" />
        </div>

        <div class="form-group">
          <label for="reg-password">Mot de passe</label>
          <input id="reg-password" type="password" formControlName="password" placeholder="••••••••" />
        </div>

        <button type="submit" [disabled]="registerForm.invalid || isLoading" class="btn-primary">
          {{ isLoading ? 'Création du compte...' : "S'inscrire" }}
        </button>
      </form>

    <!-- Bouton de bascule Login / Register -->
    <div class="auth-footer">
      <p>
        {{ isLoginMode ? "Vous n'avez pas encore de compte ?" : "Vous avez déjà un compte ?" }}
        <button type="button" (click)="toggleMode()" class="btn-link">
          {{ isLoginMode ? "S'inscrire" : 'Se connecter' }}
        </button>
      </p>
    </div>
  </div>
</div>
