services:
  # 1. Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: demobank-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - demobank-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  # 2. Backend Spring Boot (image depuis ECR)
  backend:
    image: 342677170112.dkr.ecr.us-east-1.amazonaws.com/demo-backend:latest
    container_name: demobank-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - demobank-net
  # 3. Frontend Angular + NGINX (image depuis ECR)
  frontend:
    image: 342677170112.dkr.ecr.us-east-1.amazonaws.com/demo-frontend:latest
    container_name: demobank-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - demobank-net
networks:
  demobank-net:
    driver: bridge
volumes:
  postgres_data: